// Example services used by tests and the echo demo binaries.
syntax = "proto3";

package aether.rpc.example;

option cc_generic_services = true;

message EchoRequest {
  string message = 1;
  int32  repeat  = 2;
}

message EchoResponse {
  string message = 1;
}

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message AddRequest {
  int32 a = 1;
  int32 b = 2;
}

message AddResponse {
  int32 sum = 1;
}

service MathService {
  rpc Add(AddRequest) returns (AddResponse);
}
